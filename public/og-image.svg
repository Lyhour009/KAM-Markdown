<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171615"/>
      <stop offset="50%" stop-color="#1B1A18"/>
      <stop offset="100%" stop-color="#201F1D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#958BFF"/>
      <stop offset="100%" stop-color="#5B4BC4"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282623"/>
      <stop offset="100%" stop-color="#201F1D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="240" cy="180" r="300" fill="#5B4BC4" opacity="0.12"/>
  <circle cx="960" cy="450" r="260" fill="#958BFF" opacity="0.08"/>

  <!-- Card Border Container -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#373531" stroke-width="1.5"/>

  <!-- Brand Emblem (84x84) -->
  <g transform="translate(100, 100)">
    <rect width="84" height="84" rx="20" fill="#302B4B" stroke="#958BFF" stroke-width="3"/>
    <!-- K lettermark -->
    <path d="M22 24V60" stroke="#958BFF" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 24L22 42L41 60" stroke="#958BFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- M lettermark -->
    <path d="M48 60V24L58 39L68 24V60" stroke="#958BFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand Name -->
  <text x="210" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="#F0EFEA" letter-spacing="-0.02em">KAM-Markdown</text>
  <text x="590" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#958BFF">v1.0</text>

  <!-- Tagline / Value Proposition -->
  <text x="100" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="600" fill="#F0EFEA">
    Fast, Private Markdown Editor with Khmer Typography
  </text>
  <text x="100" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#AAA79F">
    Instant split preview, calibrated Khmer Unicode vowels, local autosave, and 1-click PNG export.
  </text>

  <!-- Feature Pills -->
  <!-- Pill 1: Split Live Preview -->
  <g transform="translate(100, 340)">
    <rect width="260" height="52" rx="12" fill="url(#pillGrad)" stroke="#373531" stroke-width="1"/>
    <text x="20" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#F0EFEA">⚡ Dual-Pane Live Preview</text>
  </g>

  <!-- Pill 2: Khmer Unicode Typography -->
  <g transform="translate(380, 340)">
    <rect width="320" height="52" rx="12" fill="url(#pillGrad)" stroke="#373531" stroke-width="1"/>
    <text x="20" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#F0EFEA">🇰🇭 Khmer Unicode Typography</text>
  </g>

  <!-- Pill 3: 100% Client-Side Privacy -->
  <g transform="translate(720, 340)">
    <rect width="280" height="52" rx="12" fill="url(#pillGrad)" stroke="#373531" stroke-width="1"/>
    <text x="20" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#F0EFEA">🔒 100% Client-Side Privacy</text>
  </g>

  <!-- Pill 4: Export to MD & PNG -->
  <g transform="translate(100, 410)">
    <rect width="290" height="52" rx="12" fill="url(#pillGrad)" stroke="#373531" stroke-width="1"/>
    <text x="20" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#F0EFEA">🖼️ Export Markdown &amp; PNG</text>
  </g>

  <!-- Pill 5: Synchronized Scrolling & Focus Mode -->
  <g transform="translate(410, 410)">
    <rect width="320" height="52" rx="12" fill="url(#pillGrad)" stroke="#373531" stroke-width="1"/>
    <text x="20" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#F0EFEA">🔄 Sync Scroll &amp; Focus Mode</text>
  </g>

  <!-- Footer Divider & Meta -->
  <line x1="100" y1="510" x2="1100" y2="510" stroke="#373531" stroke-width="1"/>
  <text x="100" y="545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#7D7971">
    github.com/Lyhour009/KAM-Markdown
  </text>
  <text x="1100" y="545" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#958BFF">
    Free &amp; Open Source • Built for Khmer &amp; Global Writers
  </text>
</svg>
